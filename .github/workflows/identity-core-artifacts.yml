name: Identity Core Artifacts

on:
  workflow_dispatch:
    inputs:
      dispatch_sync:
        description: Dispatch the edwin consumer sync workflow after artifact upload
        required: false
        default: true
        type: boolean
      sync_repository:
        description: Consumer repository to notify for artifact sync
        required: false
        default: jonesj38/edwin
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-identity-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            libName: libedwinpai_identity_core.so
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            libName: libedwinpai_identity_core.so
          - runner: macos-14
            target: x86_64-apple-darwin
            libName: libedwinpai_identity_core.dylib
          - runner: macos-14
            target: aarch64-apple-darwin
            libName: libedwinpai_identity_core.dylib
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            libName: edwinpai_identity_core.dll

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux arm64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build identity-core shared library
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
        run: cargo build --manifest-path src-tauri/Cargo.toml -p edwinpai-identity-core --release --target ${{ matrix.target }}

      - name: Verify artifact exists
        shell: bash
        run: |
          set -euo pipefail
          test -f "src-tauri/target/${{ matrix.target }}/release/${{ matrix.libName }}"

      - name: Write artifact manifest
        shell: bash
        env:
          ARTIFACT_PATH: src-tauri/target/${{ matrix.target }}/release/${{ matrix.libName }}
          MANIFEST_PATH: src-tauri/target/${{ matrix.target }}/release/identity-core-artifact.json
          RUST_TARGET: ${{ matrix.target }}
          RUNNER_NAME: ${{ matrix.runner }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifact = Path(os.environ["ARTIFACT_PATH"])
          manifest = Path(os.environ["MANIFEST_PATH"])
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          payload = {
              "target": os.environ["RUST_TARGET"],
              "runner": os.environ["RUNNER_NAME"],
              "file": artifact.name,
              "sha256": digest,
          }
          manifest.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload identity-core artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: identity-core-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/${{ matrix.libName }}
            src-tauri/target/${{ matrix.target }}/release/identity-core-artifact.json

  notify-edwin-sync:
    needs: build-identity-core
    runs-on: ubuntu-latest
    if: ${{ needs.build-identity-core.result == 'success' }}
    env:
      SHOULD_DISPATCH: ${{ github.event_name != 'workflow_dispatch' || inputs.dispatch_sync }}
      SYNC_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_repository || format('{0}/edwin', github.repository_owner) }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.run_id }}
      ARTIFACT_PATTERN: identity-core-*
      IDENTITY_CORE_SYNC_REPO_TOKEN: ${{ secrets.IDENTITY_CORE_SYNC_REPO_TOKEN }}
      PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
    steps:
      - name: Dispatch edwin identity-core artifact sync
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${SHOULD_DISPATCH}" != "true" ]]; then
            echo "Skipping sync dispatch because workflow_dispatch input dispatch_sync=false."
            exit 0
          fi

          if [[ -z "${IDENTITY_CORE_SYNC_REPO_TOKEN:-}" && -z "${PUBLIC_REPO_PAT:-}" ]]; then
            echo "Skipping sync dispatch because neither IDENTITY_CORE_SYNC_REPO_TOKEN nor PUBLIC_REPO_PAT is configured."
            echo "Configure a token in edwin-desktop that can trigger workflows in ${SYNC_REPOSITORY}. Prefer IDENTITY_CORE_SYNC_REPO_TOKEN; PUBLIC_REPO_PAT is accepted as a fallback."
            exit 0
          fi

          python3 - <<'PY' > dispatch.json
          import json
          import os

          payload = {
              "event_type": "identity-core-artifacts-ready",
              "client_payload": {
                  "source_repository": os.environ["SOURCE_REPOSITORY"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
                  "artifact_pattern": os.environ["ARTIFACT_PATTERN"],
              },
          }
          print(json.dumps(payload))
          PY

          python3 - <<'PY' > workflow-dispatch.json
          import json
          import os

          payload = {
              "ref": "main",
              "inputs": {
                  "source_repository": os.environ["SOURCE_REPOSITORY"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
                  "artifact_pattern": os.environ["ARTIFACT_PATTERN"],
              },
          }
          print(json.dumps(payload))
          PY

          try_workflow_dispatch() {
            local label="$1"
            local token="$2"
            [[ -n "$token" ]] || return 1

            echo "Trying workflow_dispatch with ${label}..."
            if GH_TOKEN="$token" gh api "repos/${SYNC_REPOSITORY}/actions/workflows/identity-core-artifact-sync.yml/dispatches" \
              --method POST \
              --input workflow-dispatch.json; then
              echo "Triggered identity-core sync in ${SYNC_REPOSITORY} via workflow_dispatch using ${label}."
              return 0
            fi

            echo "workflow_dispatch failed with ${label}." >&2
            return 1
          }

          try_repository_dispatch() {
            local label="$1"
            local token="$2"
            [[ -n "$token" ]] || return 1

            echo "Trying repository_dispatch with ${label}..."
            if GH_TOKEN="$token" gh api "repos/${SYNC_REPOSITORY}/dispatches" \
              --method POST \
              --input dispatch.json; then
              echo "Triggered identity-core sync in ${SYNC_REPOSITORY} via repository_dispatch using ${label}."
              return 0
            fi

            echo "repository_dispatch failed with ${label}." >&2
            return 1
          }

          if try_workflow_dispatch "IDENTITY_CORE_SYNC_REPO_TOKEN" "${IDENTITY_CORE_SYNC_REPO_TOKEN:-}"; then
            exit 0
          fi

          if try_workflow_dispatch "PUBLIC_REPO_PAT" "${PUBLIC_REPO_PAT:-}"; then
            exit 0
          fi

          if try_repository_dispatch "IDENTITY_CORE_SYNC_REPO_TOKEN" "${IDENTITY_CORE_SYNC_REPO_TOKEN:-}"; then
            exit 0
          fi

          if try_repository_dispatch "PUBLIC_REPO_PAT" "${PUBLIC_REPO_PAT:-}"; then
            exit 0
          fi

          echo "Failed to trigger identity-core sync in ${SYNC_REPOSITORY}."
          echo "Checked both workflow_dispatch and repository_dispatch using IDENTITY_CORE_SYNC_REPO_TOKEN and PUBLIC_REPO_PAT."
          echo "The configured token likely lacks access to ${SYNC_REPOSITORY} or is scoped without workflow/repository-dispatch permission."
          exit 1
