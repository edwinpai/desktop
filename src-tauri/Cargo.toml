[package]
name = "edwinpai-desktop"
version = "1.0.0-beta.8"
description = "EdwinPAI Desktop — AI assistant for everyone"
authors = ["EdwinPAI"]
edition = "2021"

[lib]
name = "edwinpai_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
edwinpai_identity_core = { package = "edwinpai-identity-core", path = "crates/identity-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Phase 1: Crypto operations
secp256k1 = { version = "0.29", features = ["rand", "rand-std", "recovery", "global-context"] }
sha2 = "0.10"
hmac = "0.12"
# Keychain integration
keyring = { version = "3.5", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
# Identicon generation (SVG)
hex = "0.4"
# Audit logging
chrono = { version = "0.4", features = ["serde"] }
serde_bytes = "0.11.19"
# Phase 2: Async runtime for overlay services
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4"
# HTTP client for overlay services integration
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# Process management (Phase 2/3)
nix = { version = "0.29", features = ["signal", "process"] }
# mDNS service discovery
mdns-sd = "0.11"
hostname = "0.4"
# Config management
dirs = "5.0"
once_cell = "1.19"
# Phase 4: QR code generation
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Phase 4: SQLite for user storage
rusqlite = { version = "0.32", features = ["bundled"] }
# Phase 4: Base64 encoding for deep links
base64 = "0.22"
# Phase 4: Random token generation
rand = "0.8"
# Phase 5: AES-256-GCM encryption for channel credentials
aes-gcm = "0.10"

[dev-dependencies]
tempfile = "3.8"
