[package]
name = "edwinpai-identity-core"
version = "0.1.0"
edition = "2021"
description = "Protected identity and authorization core for EdwinPAI"
license = "UNLICENSED"

[lib]
name = "edwinpai_identity_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.29", features = ["rand", "rand-std", "recovery", "global-context"] }
sha2 = "0.10"
hmac = "0.12"
keyring = "3.5"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde_bytes = "0.11.19"
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
dirs = "5.0"
once_cell = "1.19"
rand = "0.8"
aes-gcm = "0.10"
