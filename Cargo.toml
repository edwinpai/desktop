[package]
name = "edwinpai-overlay-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "edwinpai_overlay_client"
path = "lib.rs"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
rand = "0.8"

[dev-dependencies]
mockito = "1.2"
